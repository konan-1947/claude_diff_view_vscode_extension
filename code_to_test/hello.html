<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xin chào — Diff View</title>
  <link rel="stylesheet" href="hello.css">
</head>
<body>
  <div class="container">
    <h1>Xin chào</h1>
    <p>Chào mừng bạn quay lại!</p>
    <p class="status">Baseline scan: nested files are supported.</p>
    <p class="hint">Nhấn Alt+L để sang file kế tiếp.</p>
    <ul class="tips">
      <li>F7 / Shift+F7 nhảy giữa các khối</li>
      <li>Ctrl+Y accept khối, Ctrl+N reject khối</li>
    </ul>
  </div>
  <footer>Demo diff view</footer>
</body>
</html>
